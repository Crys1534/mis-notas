name: Crear APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Copiar la app a la carpeta www
        run: |
          mkdir -p www
          cp index.html style.css app.js sounds.js stickers.js manifest.json icon.svg icon-192.png icon-512.png apple-touch-icon.png www/
          # en el APK no hace falta el service worker
          sed -i 's#<link rel="manifest"[^>]*>##' www/index.html

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - run: pip install pillow
      - name: Icono de la app
        run: |
          cat > icons.py <<'PYEOF'
          from PIL import Image
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          img = Image.open('icon-512.png').convert('RGBA')
          for name, px in sizes.items():
              d = 'android/app/src/main/res/mipmap-' + name
              os.makedirs(d, exist_ok=True)
              for f in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  img.resize((px, px)).save(d + '/' + f + '.png')
          PYEOF
          python3 icons.py
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml

      - name: Construir APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Calendario-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
